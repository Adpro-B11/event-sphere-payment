spring.application.name=event-sphere-payment

# H2 In-Memory Database Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT secret key
JWT_SECRET_KEY=secret123456

# Auth service URL (misalnya kamu run di port 8081)
auth.service.url=http://localhost:8080

# Event service callback URL (misalnya kamu run event service di port 8082)
event.service.callback.url=http://localhost:8081
